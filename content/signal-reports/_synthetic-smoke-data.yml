# SYNTHETIC SMOKE DATA — NOT FOR PRODUCTION.
#
# Companion to the production data file
# `2026-05-28-tinyml-reality-check-data.yml`. Mirrors that file's
# shape with plausible-but-fake numbers so local Chart.js verification
# has something to render without using production values.
#
# The leading underscore is the marker that this file is excluded
# from any future BlogSyncService run. If the sync service does not
# yet honour an underscore prefix, treat the prefix as a manual
# do-not-sync flag and add the actual exclusion when the sync code
# is introduced.
#
# Numbers below are deliberately fictional: latency values land in
# realistic-looking orders of magnitude for Tier 1 MCUs, Wh/1000
# values fall in a plausible Wh/1000 band for steady inference load, and 20-run
# strips assume CV around 4-8% with a few outliers in the IC/AD
# cells. This file remains synthetic and is excluded from publication.

hardware_curve_tier1:
  chart_type: line
  title: "Latency across the Tier 1 floor"
  x_axis:
    label: "Target"
    unit: null
    scale: categorical
    values:
      - "STM32 F401RE"
      - "Arduino Nano 33 BLE Sense"
      - "ESP32-S3"
    ordering_rationale: "Ordered by MCU capability proxy: SRAM budget, clock class, and expected inference throughput."
  y_axis:
    label: "Median latency"
    unit: ms
    scale: log
    value_source: "Run latency_stats.median_us converted to ms; headline is median across runs per cell."
  series:
    - label: "Keyword Spotting"
      task: kws
      color: "var(--signal-green)"
      data: [42.6, 18.3, 11.1]
    - label: "Image Classification"
      task: ic
      color: "var(--amber)"
      data: [612.4, 188.0, 96.2]
    - label: "Anomaly Detection"
      task: ad
      color: "var(--coral)"
      data: [98.7, 41.9, 24.4]
  annotations:
    - type: dashed_extension
      position: x_axis_right
      label: "Posts 2–5 →"
      arrow: right
  caption_template: |
    [SMOKE] ESP32-S3 leads on every task; Tier 1 latency spread is roughly 25× between fastest and slowest cell. Log scale.

energy_comparison_tier1:
  chart_type: bar
  title: "Wh per 1000 inferences across Tier 1"
  x_axis:
    label: "Target"
    unit: null
    scale: categorical
    values:
      - "STM32 F401RE"
      - "Arduino Nano 33 BLE Sense"
      - "ESP32-S3"
    grouping: "Three task bars per target."
  y_axis:
    label: "Energy"
    unit: "Wh per 1000 inferences"
    scale: log
    value_source: "Run energy_stats.wh_per_1000; headline is median across runs per cell."
  bar_count:
    total: 9
    rationale: "Three tasks across three Tier 1 MCUs. No placeholder bars for devices that do not run the workload."
  series:
    - label: "Keyword Spotting"
      task: kws
      color: "var(--signal-green)"
      data: [0.0061, 0.0083, 0.0118]
    - label: "Image Classification"
      task: ic
      color: "var(--amber)"
      data: [0.0540, 0.0312, 0.0438]
    - label: "Anomaly Detection"
      task: ad
      color: "var(--coral)"
      data: [0.0094, 0.0117, 0.0156]
  annotations: []
  caption_template: |
    [SMOKE] F401RE is the lowest-energy target on KWS and IC despite being the slowest, because its idle power floor is lower than the other two boards.

