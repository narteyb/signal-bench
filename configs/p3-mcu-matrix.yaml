schema_version: 1
name: p3-mcu-repeat-coverage
version: 1.0.0
description: "P3 MCU repeatability coverage: three TinyML tasks across the MCU targets."
created: "2026-05-29"

tasks:
  - kws
  - ic
  - ad

targets:
  - f401re
  - nano33
  - esp32s3

defaults:
  iterations: 100
  warmup_iterations: 10
  required_runs: 3
  latency_budget_ms: null
  accuracy_threshold: null
  energy_budget_uwh: null

cells:
  - task: kws
    target: f401re
    accuracy_threshold: 0.81
    latency_budget_ms: 100
  - task: kws
    target: nano33
    accuracy_threshold: 0.81
    latency_budget_ms: 80
  - task: kws
    target: esp32s3
    accuracy_threshold: 0.81
    latency_budget_ms: 50

  - task: ic
    target: f401re
    accuracy_threshold: 0.765
    latency_budget_ms: 500
  - task: ic
    target: nano33
    accuracy_threshold: 0.765
    latency_budget_ms: 300
  - task: ic
    target: esp32s3
    accuracy_threshold: 0.765
    latency_budget_ms: 150

  - task: ad
    target: f401re
    accuracy_threshold: 0.765
    latency_budget_ms: 200
  - task: ad
    target: nano33
    accuracy_threshold: 0.765
    latency_budget_ms: 150
  - task: ad
    target: esp32s3
    accuracy_threshold: 0.765
    latency_budget_ms: 75

exclusions: []
phase_5_overrides: {}
