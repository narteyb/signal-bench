[tool.ruff.lint.isort]
known-first-party = ["experiments", "signal_bench", "signal_bench_cli"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/signal_bench"]

[[tool.mypy.overrides]]
module = ["signal_bench_cli.*", "tests.*"]
strict = false

[[tool.mypy.overrides]]
module = ["pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=signal_bench --cov-report=term-missing --cov-fail-under=80"
markers = [
  "hardware: tests that require physical hardware to be attached (skipped in CI)",
  "hardware_fnb58: tests that require a paired FNIRSI FNB58 BLE power meter",
  "smoke: fast end-to-end smoke checks for newly introduced surfaces",
]

[tool.coverage.run]
omit = [
  "src/signal_bench/adapters/__init__.py",
  "src/signal_bench/adapters/base.py",
  "src/signal_bench/adapters/exceptions.py",
  "src/signal_bench/adapters/mcu/__init__.py",
  "src/signal_bench/adapters/mcu/config.py",
  "src/signal_bench/adapters/mcu/frames.py",
  "src/signal_bench/adapters/mcu/task.py",
]
