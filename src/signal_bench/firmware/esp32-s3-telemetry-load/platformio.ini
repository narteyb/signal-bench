; signal-bench / firmware / esp32-s3-telemetry-load
;
; Deterministic P1 telemetry load source for ESP32-S3-DevKitC-1.

[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = espidf
platform_packages =
    platformio/framework-espidf @ 3.50201.240515

monitor_speed = 115200
monitor_filters = colorize, time

build_flags =
    -DSIGNAL_BENCH_VERSION=\"0.1.0.dev0\"

build_type = release
