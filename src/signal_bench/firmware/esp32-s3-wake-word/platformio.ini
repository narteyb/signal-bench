; signal-bench / firmware / esp32-s3-wake-word
;
; Verified-working toolchain (M3-prep, 2026-05-03):
;   - PlatformIO Core: 6.1.19
;   - platform-espressif32: 6.6.0
;   - ESP-IDF: 5.2.1 (framework-espidf 3.50201.240515)
;   - Board: ESP32-S3-DevKitC-1-N8 (8MB Flash, no PSRAM board definition)
;
; Pinned per Architecture R3. When updating the platform or framework version,
; record the new verified-working tuple in this header and in the README.

[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = espidf
platform_packages =
    platformio/framework-espidf @ 3.50201.240515

monitor_speed = 115200
monitor_filters = colorize, time

build_flags =
    -DSIGNAL_BENCH_VERSION=\"0.1.0.dev0\"
    -DCONFIG_FREERTOS_HZ=1000

build_type = release
