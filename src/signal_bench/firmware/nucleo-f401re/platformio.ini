; signal-bench / firmware / nucleo-f401re
;
; T1.8 compile-only scaffold:
;   - Board: ST NUCLEO-F401RE
;   - Framework: Arduino-on-STM32 via PlatformIO
;   - Transport: ST-Link USB virtual COM port

[env:nucleo_f401re]
platform = ststm32 @ 19.6.0
board = nucleo_f401re
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_flags =
    -std=gnu++17
    -DSIGNAL_BENCH_VERSION=\"0.1.0.dev0\"
