; signal-bench / firmware / nano33-ble-sense-rev2
;
; T1.7 compile-only scaffold:
;   - Board: Arduino Nano 33 BLE Sense Rev2 / Nano 33 BLE class target
;   - Framework: Arduino Mbed OS core via PlatformIO
;   - Transport: native USB-CDC Serial

[env:nano33ble]
platform = nordicnrf52 @ 10.11.0
board = nano33ble
framework = arduino
monitor_speed = 115200
build_flags =
    -DSIGNAL_BENCH_VERSION=\"0.1.0.dev0\"
    -Wno-cpp
