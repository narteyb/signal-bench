[env:nucleo_f401re]
platform = ststm32@19.6.0
board = nucleo_f401re
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_flags = -w -std=gnu++17 -DSIGNAL_BENCH_VERSION=\"0.2.0.dev0\"
lib_compat_mode = off
lib_deps =
    spaziochirale/Chirale_TensorFLowLite@2.0.0
